<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — MyTripPilot</title>
    <script>
      (() => {
        const legalPaths = ['/privacy-policy', '/terms', '/delete-account', '/confirm'];
        const path = window.location.pathname.replace(/\/+$/, '');
        if (legalPaths.includes(path)) {
          window.location.replace(`${path}/${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The requested MyTripPilot page could not be found.</p>
      <a href="/">Go to MyTripPilot</a>
    </main>
  </body>
</html>
